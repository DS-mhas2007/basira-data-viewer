name: Refresh chart dependency locks

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Remove Recharts and regenerate lockfiles
        run: |
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json','utf8')); delete p.dependencies?.recharts; delete p.devDependencies?.recharts; fs.writeFileSync('package.json', JSON.stringify(p,null,2)+'\\n')"
          bun install --lockfile-only
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          if grep -n 'recharts' package.json bun.lock package-lock.json; then
            echo "Recharts remains in dependency manifests or lockfiles."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: chart-dependency-lock-refresh
          path: |
            package.json
            bun.lock
            package-lock.json
          if-no-files-found: error
