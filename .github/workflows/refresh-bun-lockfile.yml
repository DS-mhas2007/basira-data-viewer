name: Refresh Bun lockfile (temporary)

on:
  push:
    branches:
      - maintenance/refresh-bun-lockfile
    paths:
      - ".github/workflows/refresh-bun-lockfile.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout maintenance branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Bun 1.4.4
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Regenerate lockfile without lifecycle scripts
        run: bun install --ignore-scripts

      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- bun.lock; then
            echo "::error::bun.lock did not change; expected the known @phosphor-icons/react lock mismatch to be resolved."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore(deps): sync bun lockfile"
          git push
