name: Refresh dependency lockfiles

on:
  push:
    branches: [main]
    paths:
      - package.json
      - bun.lock
      - .github/workflows/refresh-lockfiles.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Regenerate Bun lockfile
        run: bun install

      - name: Upload generated lockfiles as a recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-bun-lockfile
          path: |
            bun.lock
          if-no-files-found: error

      - name: Commit generated lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          if git diff --cached --quiet; then
            echo "Lockfiles are already current."
            exit 0
          fi
          git commit -m "chore(deps): refresh lockfiles for svg2pdf.js"
          git push origin HEAD:main
