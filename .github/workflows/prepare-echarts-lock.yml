name: Prepare ECharts lockfile

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/prepare-echarts-lock.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Resolve and commit ECharts dependency
        run: |
          bun add echarts@5.6.0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock
          git commit -m "chore(charts): add ECharts 5.6.0 dependency"
          git push origin HEAD:main
